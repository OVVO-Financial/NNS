name: CRAN memtests (ASAN/UBSAN)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  memtests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rocker/r-devel-ubsan-clang
            id: r-devel-ubsan-clang
          - image: rocker/r-devel-san
            id: r-devel-san

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull ${{ matrix.image }}
        run: docker pull ${{ matrix.image }}

      - name: Run under ${{ matrix.image }}
        run: |
          docker run --rm --cap-add=SYS_PTRACE \
            -e OMP_THREAD_LIMIT=1 \
            -e OMP_NUM_THREADS=1 \
            -e OPENBLAS_NUM_THREADS=1 \
            -e MKL_NUM_THREADS=1 \
            -e VECLIB_MAXIMUM_THREADS=1 \
            -e RCPP_PARALLEL_NUM_THREADS=1 \
            -e ASAN_OPTIONS=detect_leaks=1:abort_on_error=1 \
            -e UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            -e RGL_USE_NULL=TRUE \
            -e MAKEFLAGS="-j2" \
            -v "${GITHUB_WORKSPACE}:/pkg" -w /pkg ${{ matrix.image }} bash -lc '
              set -euo pipefail
              echo "== R-devel (sanitized) =="
              RD -q -e "R.version[c(\"version.string\",\"platform\")]; sessionInfo()"

              echo "== apt: system libraries (rgl, pandoc, etc.) =="
              apt-get update -y
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                pandoc \
                libgl1-mesa-dev libglu1-mesa-dev freeglut3-dev mesa-common-dev \
                libx11-dev libxext-dev libxt-dev libxmu-dev libxxf86vm-dev \
                libcurl4-openssl-dev libssl-dev libxml2-dev

              echo "== Install R dependencies (Imports/Suggests for vignettes) =="
              RD -q -e "install.packages(c( \
                \"Rcpp\",\"RcppParallel\",\"data.table\",\"knitr\",\"rmarkdown\", \
                \"doParallel\",\"foreach\",\"quantmod\",\"Rfast\",\"rgl\",\"xts\",\"zoo\",\"TTR\" \
              ), repos=\"https://cloud.r-project.org\", Ncpus=2)"

              echo "== Build tarball =="
              RD CMD build .
              TARBALL=$(ls -1t *.tar.gz | head -n1)
              echo "Built: ${TARBALL}"

              echo "== R CMD check (sanitized) =="
              set +e
              RD CMD check "${TARBALL}" --as-cran --no-manual
              STATUS=$?
              set -e

              echo "== Harvest logs =="
              PKG=${TARBALL%.tar.gz}
              CHECKDIR="${PKG}.Rcheck"
              [ -f "${CHECKDIR}/00check.log" ] && tail -n 400 "${CHECKDIR}/00check.log" || true
              [ -f "${CHECKDIR}/00install.out" ] && tail -n 200 "${CHECKDIR}/00install.out" || true
              find "${CHECKDIR}" -maxdepth 3 -name "*vignette*.log" -print -exec tail -n 120 {} \; || true
              exit ${STATUS}
            '

      - name: Upload check artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}-Rcheck
          path: |
            *.tar.gz
            *.Rcheck/**
          if-no-files-found: warn

  # Optional: just rebuild vignettes to mirror CRAN's build_vignettes.log
  vignettes-only:
    runs-on: ubuntu-latest
    needs: memtests
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull rocker/r-devel-ubsan-clang
        run: docker pull rocker/r-devel-ubsan-clang

      - name: Build vignettes under clang ASAN
        run: |
          docker run --rm --cap-add=SYS_PTRACE \
            -e OMP_THREAD_LIMIT=1 \
            -e OMP_NUM_THREADS=1 \
            -e OPENBLAS_NUM_THREADS=1 \
            -e MKL_NUM_THREADS=1 \
            -e VECLIB_MAXIMUM_THREADS=1 \
            -e RCPP_PARALLEL_NUM_THREADS=1 \
            -e RGL_USE_NULL=TRUE \
            -v "${GITHUB_WORKSPACE}:/pkg" -w /pkg rocker/r-devel-ubsan-clang bash -lc '
              set -euo pipefail
              apt-get update -y
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pandoc \
                libgl1-mesa-dev libglu1-mesa-dev freeglut3-dev mesa-common-dev \
                libx11-dev libxext-dev libxt-dev libxmu-dev libxxf86vm-dev \
                libcurl4-openssl-dev libssl-dev libxml2-dev
              RD -q -e "install.packages(c(\"Rcpp\",\"RcppParallel\",\"data.table\",\"knitr\",\"rmarkdown\"), repos=\"https://cloud.r-project.org\", Ncpus=2)"
              RD -q -e "tools::buildVignettes(dir=\".\")"
            '

      - name: Upload vignette logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vignettes-only-logs
          path: |
            *.Rcheck/**/vignette*.log
            vignettes/*.html
          if-no-files-found: ignore
