name: R-CMD-check

on:
  push:
    branches: ["NNS-Beta-Version"]
  pull_request:
    branches: ["NNS-Beta-Version"]
  workflow_dispatch:

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}
          - {os: windows-latest, r: 'devel'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: macos-latest,   r: 'release'}

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      _R_CHECK_FORCE_SUGGESTS_: false
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RGL_USE_NULL: true
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      # ---- System deps (Ubuntu) ----
      - name: Install system libraries (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgsl-dev \
            libjpeg-turbo8-dev libpng-dev libtiff5-dev \
            libfreetype6-dev libharfbuzz-dev libfribidi-dev \
            libgl1-mesa-dev libglu1-mesa-dev freeglut3-dev \
            xorg-dev

      # ---- System deps (macOS) ----
      - name: Install dependencies on macOS
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install xquartz
          brew install fribidi
          brew install gsl
          # persist GSL flags for subsequent steps
          echo "PKG_CPPFLAGS=-I$(brew --prefix gsl)/include" >> "$GITHUB_ENV"
          echo "PKG_LIBS=-L$(brew --prefix gsl)/lib -lgsl -lgslcblas -lm" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/opt/gsl/lib/pkgconfig" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # Keep your original libjpeg bootstrap for macOS
      - name: Install CRAN libjpeg on macOS
        if: runner.os == 'macOS'
        run: |
          ARCH=`uname -m`
          if [ ! -e /opt/R/$ARCH ]; then sudo mkdir -p /opt/R/$ARCH; sudo chown -R $USER /opt/R; fi
          sudo Rscript -e 'dep="jpeg"; source("https://mac.R-project.org/bin/install.R"); install.libs(dep)'
          if ! echo $PATH | grep /opt/R/$ARCH/bin >/dev/null; then echo /opt/R/$ARCH/bin > newPATH; cat $GITHUB_PATH >> newPATH; cat newPATH > $GITHUB_PATH; fi
        shell: bash

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Install R packages
        shell: Rscript {0}
        run: |
          install.packages(c("remotes", "rcmdcheck", "Rfast", "recipes"))
          remotes::install_cran("rgl")
          remotes::install_deps(dependencies = TRUE)

      - name: Check
        shell: Rscript {0}
        run: |
          rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--ignore-vignettes", "--no-build-vignettes"),
            build_args = c("--no-manual", "--ignore-vignettes", "--no-build-vignettes"),
            error_on = "error"
          )
