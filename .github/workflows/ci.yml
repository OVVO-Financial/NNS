name: R-CMD-check

on:
  push:
    branches: ["NNS-Beta-Version"]
  pull_request:
    branches: ["NNS-Beta-Version"]
  workflow_dispatch:

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}
          - {os: windows-latest, r: 'devel'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: macos-latest,   r: 'release'}

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      _R_CHECK_FORCE_SUGGESTS_: false
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RGL_USE_NULL: true
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      # ---- System deps (Ubuntu) ----
      - name: Install system libraries (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgsl-dev \
            libjpeg-turbo8-dev libpng-dev libtiff5-dev \
            libfreetype6-dev libharfbuzz-dev libfribidi-dev \
            libgl1-mesa-dev libglu1-mesa-dev freeglut3-dev \
            xorg-dev

      # ---- System deps (macOS) ----
      - name: Install dependencies on macOS
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install xquartz fribidi gsl
          echo "PKG_CPPFLAGS=-I$(brew --prefix gsl)/include" >> "$GITHUB_ENV"
          echo "PKG_LIBS=-L$(brew --prefix gsl)/lib -lgsl -lgslcblas -lm" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/opt/gsl/lib/pkgconfig" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Install CRAN libjpeg on macOS
        if: runner.os == 'macOS'
        run: |
          ARCH=`uname -m`
          if [ ! -e /opt/R/$ARCH ]; then sudo mkdir -p /opt/R/$ARCH; sudo chown -R $USER /opt/R; fi
          sudo Rscript -e 'dep="jpeg"; source("https://mac.R-project.org/bin/install.R"); install.libs(dep)'
          if ! echo $PATH | grep /opt/R/$ARCH/bin >/dev/null; then echo /opt/R/$ARCH/bin > newPATH; cat $GITHUB_PATH >> newPATH; cat newPATH > $GITHUB_PATH; fi
        shell: bash

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Check
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--ignore-vignettes", "--no-build-vignettes")'
          error-on: '"error"'

  ubsan-clang-docker:
    name: UBSAN clang (rocker r-devel-ubsan-clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run UBSAN check inside container
        run: |
          docker run --rm --platform linux/x86_64 \
            --cap-add=SYS_PTRACE \
            -e UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=0" \
            -e RGL_USE_NULL=true \
            -v "${GITHUB_WORKSPACE}:/data" -w /data \
            rocker/r-devel-ubsan-clang bash -lc '
              set -euo pipefail

              echo "::group::Install system dependencies"
              apt-get update -y
              
              # Fix for Debian Sid dependency conflicts
              DEBIAN_FRONTEND=noninteractive apt-get install -y -f
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                libgbm1 libegl-mesa0 libegl1 \
                cmake libgsl-dev \
                libcurl4-openssl-dev libssl-dev libxml2-dev \
                libgl1-mesa-dev libglu1-mesa-dev \
                libjpeg-dev libpng-dev libtiff5-dev \
                libfreetype6-dev libharfbuzz-dev libfribidi-dev
              echo "::endgroup::"

              echo "::group::Install R package dependencies"
              RD -q -e "install.packages(c(\"remotes\", \"rcmdcheck\", \"Rfast\", \"rgl\", \"recipes\"), repos=\"https://cloud.r-project.org\", Ncpus=parallel::detectCores())"
              RD -q -e "remotes::install_deps(dependencies = TRUE, repos=\"https://cloud.r-project.org\")"
              echo "::endgroup::"

              echo "::group::Run R CMD check with UBSAN"
              RD CMD check --no-manual --ignore-vignettes --no-build-vignettes . \
                > ubsan_check.out 2> ubsan_check.err || true
              echo "::endgroup::"
              
              echo "::group::UBSAN output"
              cat ubsan_check.err
              echo "::endgroup::"
            '

      - name: Check for UBSAN errors
        run: |
          if [ -f ubsan_check.err ]; then
            if grep -iE "(runtime error|sanitizer)" ubsan_check.err; then
              echo "::error::UBSAN detected runtime errors."
              exit 1
            else
              echo "::notice::No UBSAN errors detected"
            fi
          fi

      - name: Upload UBSAN logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubsan-logs
          path: |
            ubsan_check.out
            ubsan_check.err
            *.Rcheck/
