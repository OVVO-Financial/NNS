name: R-CMD-check

on:
  push:
    branches: ["NNS-Beta-Version"]
  pull_request:
    branches: ["NNS-Beta-Version"]
  workflow_dispatch:

jobs:
  R-CMD-check:
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}
          - {os: windows-latest, r: 'devel'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          # Prefer Intel mac for wider binary availability; adjust if you want Apple Silicon
          - {os: macos-13,       r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      _R_CHECK_FORCE_SUGGESTS_: false
      RGL_USE_NULL: true
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # ---------- System dependencies ----------
      # Linux: install GSL + typical image/graphics deps used by CRAN pkgs (jpeg, png, freetype, harfbuzz) and GL bits for rgl
      - name: Install system libs (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgsl-dev \
            libjpeg-turbo8-dev libpng-dev libtiff5-dev \
            libfreetype6-dev libharfbuzz-dev libfribidi-dev \
            libgl1-mesa-dev libglu1-mesa-dev freeglut3-dev \
            xorg-dev
      # macOS: install GSL and text shaping libs; XQuartz provides GL for rgl
      - name: Install system libs (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install gsl fribidi harfbuzz freetype libpng jpeg
          brew install --cask xquartz
          # help pkg-config find Homebrew formulae
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/opt/gsl/lib/pkgconfig" >> "$GITHUB_ENV"

      # ---------- R dependencies ----------
      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # rcmdcheck is pulled automatically by check-r-package, but we keep it explicit
          extra-packages: any::rcmdcheck
          needs: check

      # If you must ensure extra CRAN packages (e.g., Rfast, recipes, rgl), do it here.
      # These will be no-ops when already present from setup-r-dependencies resolution.
      - name: Ensure additional CRAN packages
        shell: Rscript {0}
        run: |
          pkgs <- c("Rfast","recipes","rgl")
          to_install <- setdiff(pkgs, rownames(installed.packages()))
          if (length(to_install)) install.packages(to_install)

      # ---------- Check ----------
      - name: Check package
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build-args: 'c("--no-manual","--no-build-vignettes")'
          args: 'c("--no-manual","--ignore-vignettes","--no-build-vignettes")'

