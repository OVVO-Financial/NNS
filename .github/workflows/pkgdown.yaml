# Workflow from official r-lib/actions (updated for headless rgl)
name: pkgdown

on:
  push:
    branches: [NNS-Beta-Version]
  pull_request:
    branches: [NNS-Beta-Version]
  release:
    types: [published]
  workflow_dispatch:

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::bookdown, local::.
          needs: website

      - name: Configure headless rgl
        run: echo "options(rgl.useNULL = TRUE)" >> ~/.Rprofile
        shell: bash

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Build book
        run: |
          old <- setwd("book")
          on.exit(setwd(old), add = TRUE)
          bookdown::render_book("index.Rmd", output_format = "bookdown::gitbook")
        shell: Rscript {0}

      - name: Stage book for Pages
        run: |
          mkdir -p docs/book
          rsync -a --delete book/_book/ docs/book/

      - name: Stage HTML examples for Pages
        run: |
          mkdir -p docs/examples
          rsync -a --delete --include='*.html' --exclude='*' examples/ docs/examples/
          {
            echo '<!doctype html><html><head><meta charset="utf-8"><title>NNS Examples</title></head><body>'
            echo '<h1>NNS Examples</h1><ul>'
            for file in docs/examples/*.html; do
              [ -e "$file" ] || continue
              name=$(basename "$file")
              title=${name%.html}
              echo "<li><a href=\"$name\">$title</a></li>"
            done
            echo '</ul></body></html>'
          } > docs/examples/index.html

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: true
          branch: gh-pages
          folder: docs
