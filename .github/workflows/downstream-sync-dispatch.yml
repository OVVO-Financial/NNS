name: Dispatch R package update downstream

on:
  push:
    branches: [NNS-Beta-Version]
    paths:
      - 'NNS_*.tar.gz'
      - 'NNS_*.tgz'
      - 'NNS_*.zip'

permissions:
  contents: read

jobs:
  dispatch-python-cache-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact R package commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve updated package release
        id: package
        shell: bash
        run: |
          set -euo pipefail

          git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > changed_files.txt
          cat changed_files.txt

          package_file="$(grep -E '^NNS_[0-9][0-9A-Za-z.-]*\.(tar\.gz|tgz|zip)$' changed_files.txt | tail -n 1 || true)"
          if [ -z "${package_file}" ]; then
            echo "No NNS package archive changed; refusing to dispatch."
            exit 1
          fi

          version="$(printf '%s' "${package_file}" | sed -E 's/^NNS_([^/]+)\.(tar\.gz|tgz|zip)$/\1/')"
          if [ -z "${version}" ] || [ "${version}" = "${package_file}" ]; then
            echo "Could not derive NNS version from ${package_file}."
            exit 1
          fi

          python - "${version}" <<'PY'
          import re
          import sys

          value = sys.argv[1]
          match = re.fullmatch(r"(\d+)\.(\d+)(?:\.\d+)?(?:[-+].*)?", value)
          if match is None:
              raise SystemExit(f"Unsupported NNS package version: {value!r}")
          if (int(match.group(1)), int(match.group(2))) < (13, 0):
              raise SystemExit(f"NNS {value} is below the supported minimum 13.0")
          PY

          source_tarball="NNS_${version}.tar.gz"
          if [ ! -f "${source_tarball}" ]; then
            source_tarball="NNS_${version}.tgz"
          fi
          windows_binary="NNS_${version}.zip"

          test -f "${source_tarball}" || {
            echo "Missing source package for NNS ${version}."
            exit 1
          }
          test -f "${windows_binary}" || {
            echo "Missing Windows binary for NNS ${version}."
            exit 1
          }

          {
            echo "r_version=${version}"
            echo "source_tarball=${source_tarball}"
            echo "windows_binary=${windows_binary}"
          } >> "${GITHUB_OUTPUT}"

      - name: Dispatch exact R package to NNS-python
        env:
          GH_TOKEN: ${{ secrets.OVVO_SYNC_TOKEN }}
          R_VERSION: ${{ steps.package.outputs.r_version }}
          SOURCE_TARBALL: ${{ steps.package.outputs.source_tarball }}
          WINDOWS_BINARY: ${{ steps.package.outputs.windows_binary }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || {
            echo "OVVO_SYNC_TOKEN is required to dispatch to NNS-python."
            exit 1
          }

          jq -n \
            --arg r_repo "${GITHUB_REPOSITORY}" \
            --arg r_commit "${GITHUB_SHA}" \
            --arg r_ref "${GITHUB_REF_NAME}" \
            --arg r_version "${R_VERSION}" \
            --arg source_tarball "${SOURCE_TARBALL}" \
            --arg windows_binary "${WINDOWS_BINARY}" \
            '{event_type: "nns-r-package-updated",
              client_payload: {
                r_repo: $r_repo,
                r_commit: $r_commit,
                r_ref: $r_ref,
                r_version: $r_version,
                source_tarball: $source_tarball,
                windows_binary: $windows_binary
              }}' > payload.json

          gh api --method POST repos/OVVO-Financial/NNS-python/dispatches --input payload.json
