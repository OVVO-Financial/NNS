name: build-linux-binary
on:
  workflow_dispatch: {}

jobs:
  linux-binary:
    runs-on: ubuntu-22.04
    env:
      R_VERSION: '4.1.2'   # <-- match the R version you deploy on shinyapps.io
      RSPM: https://packagemanager.posit.co/cran/__linux__/jammy/latest
      RGL_USE_NULL: 'TRUE'
      _R_CHECK_FORCE_SUGGESTS_: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}

      # System libs needed by deps (notably rgl)
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gfortran \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libglu1-mesa-dev mesa-common-dev freeglut3-dev \
            libx11-dev libxxf86vm-dev libxext-dev \
            libpng-dev libjpeg-dev libtiff5-dev

      # Install your Imports explicitly BEFORE R CMD build
      - name: Install package Imports
        run: |
          Rscript -e 'repos <- Sys.getenv("RSPM", "https://cloud.r-project.org");
                      install.packages(c("remotes","desc"), repos = repos);
                      remotes::install_deps(dependencies = TRUE, upgrade = "never", repos = repos)'
          Rscript -e 'need <- c("Rcpp","RcppArmadillo","RcppParallel",
                                "data.table","foreach","doParallel",
                                "quantmod","Rfast","rgl","xts","zoo");
                      miss <- setdiff(need, rownames(installed.packages()));
                      if (length(miss)) stop("Missing packages: ", paste(miss, collapse=", "))'

      # Build source tarball (now that deps are present)
      - name: Build source tarball
        run: R CMD build --no-manual --no-build-vignettes .

      # Read DESCRIPTION for artifact naming
      - name: Read DESCRIPTION
        id: desc
        run: |
          Rscript -e 'd<-read.dcf("DESCRIPTION")[1,];
                      cat(sprintf("PACKAGE=%s\nVERSION=%s\n", d["Package"], d["Version"]))' >> $GITHUB_OUTPUT

      # Build Linux binary from the source tarball
      - name: Build Linux binary
        run: |
          SRC="${{ steps.desc.outputs.PACKAGE }}_${{ steps.desc.outputs.VERSION }}.tar.gz"
          echo "Building binary from $SRC"
          R CMD INSTALL --build "$SRC"
          ls -l "${{ steps.desc.outputs.PACKAGE }}"_*_R_x86_64-pc-linux-gnu.tar.gz

      # Upload the binary tarball
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.desc.outputs.PACKAGE }}-${{ steps.desc.outputs.VERSION }}-linux-binary
          path: ${{ steps.desc.outputs.PACKAGE }}_*_R_x86_64-pc-linux-gnu.tar.gz
