# .github/workflows/build-linux-binary.yml
name: build-linux-binary

on:
  workflow_dispatch: {}

jobs:
  linux-binary:
    runs-on: ubuntu-20.04
    env:
      # Match the R used by your shinyapps.io deployment
      R_VERSION: '4.1.2'
      # Posit PPM for fast CRAN on Ubuntu focal (20.04)
      RSPM: https://packagemanager.posit.co/cran/__linux__/focal/latest
      CRAN: https://cloud.r-project.org
      # rgl on CI without a display
      RGL_USE_NULL: 'TRUE'
      # You can loosen suggests during build/check if needed
      _R_CHECK_FORCE_SUGGESTS_: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R ${{ env.R_VERSION }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}

      # System libs for curl/ssl/xml and OpenGL/X11 (needed by rgl)
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gfortran \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libglu1-mesa-dev mesa-common-dev freeglut3-dev \
            libx11-dev libxxf86vm-dev libxext-dev \
            libpng-dev libjpeg-dev libtiff5-dev

      # Install your Imports explicitly BEFORE the build
      - name: Install package Imports
        run: |
          Rscript -e 'repos <- Sys.getenv("RSPM", Sys.getenv("CRAN")); \
                      install.packages(c("Rcpp","RcppArmadillo","RcppParallel", \
                                         "data.table","foreach","doParallel", \
                                         "quantmod","Rfast","rgl","xts","zoo"), \
                                        repos = repos)'
      # Double-check we really have them
      - name: Verify Imports are installed
        run: |
          Rscript -e 'need <- c("Rcpp","RcppArmadillo","RcppParallel","data.table","foreach","doParallel","quantmod","Rfast","rgl","xts","zoo"); \
                      miss <- setdiff(need, rownames(installed.packages())); \
                      if (length(miss)) stop("Missing packages: ", paste(miss, collapse=", "))'

      # Build source tarball (skip vignettes/manual to keep it lean)
      - name: Build source tarball
        run: R CMD build --no-manual --no-build-vignettes .

      # Read DESCRIPTION for artifact naming
      - name: Read DESCRIPTION
        id: desc
        run: |
          R -q -e "d<-read.dcf('DESCRIPTION')[1,]; \
                   write(sprintf('PACKAGE=%s', d['Package']), file=Sys.getenv('GITHUB_OUTPUT'), append=TRUE); \
                   write(sprintf('VERSION=%s', d['Version']), file=Sys.getenv('GITHUB_OUTPUT'), append=TRUE)"

      # Build Linux binary from the source tarball
      - name: Build Linux binary
        run: |
          SRC="${{ steps.desc.outputs.PACKAGE }}_${{ steps.desc.outputs.VERSION }}.tar.gz"
          echo "Building binary from $SRC"
          R CMD INSTALL --build "$SRC"
          ls -l "${{ steps.desc.outputs.PACKAGE }}"_*_R_x86_64-pc-linux-gnu.tar.gz

      # Upload the binary tarball
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.desc.outputs.PACKAGE }}-${{ steps.desc.outputs.VERSION }}-linux-binary
          path: ${{ steps.desc.outputs.PACKAGE }}_*_R_x86_64-pc-linux-gnu.tar.gz
