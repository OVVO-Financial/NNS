# .github/workflows/build-linux-binary.yml
name: build-linux-binary

on:
  workflow_dispatch: {}
  push:
    tags: ['v*']        # optional: also build on version tags

jobs:
  linux-binary:
    runs-on: ubuntu-22.04
    env:
      # Use Posit PPM for fast, reproducible CRAN binaries on Ubuntu
      RSPM: https://packagemanager.posit.co/cran/__linux__/jammy/latest
      # <<< IMPORTANT >>> set this to the SAME R version your shinyapps.io app uses
      R_VERSION: '4.1.2'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R ${{ env.R_VERSION }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}

      # System libraries commonly required by your deps (rgl, curl, XML, etc.)
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gfortran \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libglu1-mesa-dev mesa-common-dev freeglut3-dev \
            libx11-dev libxxf86vm-dev libxext-dev \
            libpng-dev libjpeg-dev libtiff5-dev

      # Install R dependencies declared in DESCRIPTION (Imports/LinkingTo/Depends/Remotes)
      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          cache: true

      # Read package name/version from DESCRIPTION for consistent artifact naming
      - name: Read package metadata
        id: desc
        run: |
          R -q -e "d<-read.dcf('DESCRIPTION')[1,]; \
                   write(sprintf('PACKAGE=%s', d['Package']), file=Sys.getenv('GITHUB_OUTPUT'), append=TRUE); \
                   write(sprintf('VERSION=%s', d['Version']), file=Sys.getenv('GITHUB_OUTPUT'), append=TRUE)"

      # Build source tarball (needed before building a binary)
      - name: Build source
        run: R CMD build .

      # Build Linux binary from the source tarball
      - name: Build Linux binary
        run: |
          SRC="${{ steps.desc.outputs.PACKAGE }}_${{ steps.desc.outputs.VERSION }}.tar.gz"
          echo "Source tarball: $SRC"
          R CMD INSTALL --build "$SRC"
          ls -l "${{ steps.desc.outputs.PACKAGE }}"_*_R_x86_64-pc-linux-gnu.tar.gz

      # Upload the binary tarball as an artifact you can download
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.desc.outputs.PACKAGE }}-${{ steps.desc.outputs.VERSION }}-linux-binary
          path: ${{ steps.desc.outputs.PACKAGE }}_*_R_x86_64-pc-linux-gnu.tar.gz

      # Optional: attach the binary to a GitHub Release when building from a tag
      - name: Upload to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.desc.outputs.PACKAGE }}_*_R_x86_64-pc-linux-gnu.tar.gz

