# .github/workflows/build-linux-binary.yml
name: build-linux-binary

on:
  workflow_dispatch: {}
  push:
    tags: ['v*']   # optional

jobs:
  linux-binary:
    runs-on: ubuntu-22.04
    env:
      # Use the same R version as your shinyapps.io app
      R_VERSION: '4.1.2'
      # Fast/reproducible CRAN for Ubuntu
      RSPM: https://packagemanager.posit.co/cran/__linux__/jammy/latest
      # Avoid failing on Suggests (only needed if you have heavy Suggests)
      _R_CHECK_FORCE_SUGGESTS_: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R ${{ env.R_VERSION }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}

      # System libs needed by deps: rgl, curl/ssl/xml, etc.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gfortran \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libglu1-mesa-dev mesa-common-dev freeglut3-dev \
            libx11-dev libxxf86vm-dev libxext-dev \
            libpng-dev libjpeg-dev libtiff5-dev

      # Install deps of the *local package* (Imports/Depends/LinkingTo/Remotes)
      - name: Install R dependencies (action)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            local::.
          needs: build
          cache: true

      # Extra safety net: install anything still missing
      - name: Install R dependencies (fallback)
        run: |
          R -q -e 'install.packages("remotes", repos = Sys.getenv("RSPM", "https://cloud.r-project.org"))'
          R -q -e 'remotes::install_deps(dependencies = TRUE, upgrade = "never", repos = Sys.getenv("RSPM", "https://cloud.r-project.org"))'

      # Build source tarball (now deps are present)
      - name: Build source
        run: R CMD build .

      # Read package name/version for artifact naming
      - name: Read DESCRIPTION
        id: desc
        run: |
          R -q -e "d<-read.dcf('DESCRIPTION')[1,]; \
                   write(sprintf('PACKAGE=%s', d['Package']), file=Sys.getenv('GITHUB_OUTPUT'), append=TRUE); \
                   write(sprintf('VERSION=%s', d['Version']), file=Sys.getenv('GITHUB_OUTPUT'), append=TRUE)"

      # Build Linux binary from the source tarball
      - name: Build Linux binary
        run: |
          SRC="${{ steps.desc.outputs.PACKAGE }}_${{ steps.desc.outputs.VERSION }}.tar.gz"
          echo "Building from $SRC"
          R CMD INSTALL --build "$SRC"
          ls -l "${{ steps.desc.outputs.PACKAGE }}"_*_R_x86_64-pc-linux-gnu.tar.gz

      # Upload the binary for download
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.desc.outputs.PACKAGE }}-${{ steps.desc.outputs.VERSION }}-linux-binary
          path: ${{ steps.desc.outputs.PACKAGE }}_*_R_x86_64-pc-linux-gnu.tar.gz

