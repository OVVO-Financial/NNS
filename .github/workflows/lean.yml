name: Lean proofs

on:
  push:
    branches: ["NNS-Beta-Version"]
    paths:
      - 'lean/**'
      - '.github/workflows/lean.yml'
  pull_request:
    paths:
      - 'lean/**'
      - '.github/workflows/lean.yml'

concurrency:
  group: lean-proofs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  proofs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -fsSL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Mathlib archives
        uses: actions/cache@v5
        with:
          path: ~/.cache/mathlib
          key: mathlib-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}
      - run: ./get-cache.sh
      - run: lake build --wfail
      - name: Check claim index
        run: |
          python3 generate_readme.py
          git diff --exit-code -- README.md
